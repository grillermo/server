; PgBouncer for the macmini's Postgres 18. Symlinked from /opt/homebrew/etc/pgbouncer.ini,
; started by after-reboot.sh (brew services start pgbouncer). Reload after editing:
;   psql -h 127.0.0.1 -p 6432 -U grillermo pgbouncer -c RELOAD
;
; Why: each Rails app kept 4-6 idle backends open (~15-30 MB each) because Solid Queue's
; heartbeats fire together every 60 s. In transaction mode those apps share a couple of
; server connections per database instead.
;
; Who goes through here: only processes started with DATABASE_PORT=6432 (the web and job
; panes of the Rails apps' ./serve). Everything else stays on 5432 directly, on purpose:
;   - db:migrate / rails console: migrations take a session-level advisory lock.
;   - backup-databases: pg_dump needs a session.
;   - rulinky (1 connection), Twenty and cal.diy (asleep most of the time), the immunemac.
;
; What clients must not do through transaction pooling: session advisory locks, LISTEN/NOTIFY,
; SQL-level PREPARE/DEALLOCATE (so Rails runs with prepared_statements: false), WITH HOLD
; cursors, temp tables across transactions, SET of an untracked setting.

[databases]
; Any database name is forwarded to the same server, under the client's own user.
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 127.0.0.1,::1
listen_port = 6432
unix_socket_dir =

auth_type = trust
auth_file = /Users/grillermo/c/server/pgbouncer/userlist.txt
admin_users = grillermo
stats_users = grillermo

pool_mode = transaction
; Measured over 10 min: 1 busy connection per app normally, 4 for <100 ms at each heartbeat.
; 2 per database covers the normal load; the heartbeats queue for a few ms. A client that
; waits more than reserve_pool_timeout gets one of 3 extra connections.
default_pool_size = 2
reserve_pool_size = 3
reserve_pool_timeout = 0.5
min_pool_size = 0
max_client_conn = 500
max_db_connections = 0

; Close server connections idle for 90 s: longer than the 60 s heartbeat, so the steady ones
; are reused, while the reserve ones opened during a burst go away.
server_idle_timeout = 90
server_lifetime = 3600
; Fail a query that waited this long for a server connection (default 120 s).
query_wait_timeout = 30

; Rails runs with prepared_statements: false; nothing here needs protocol-level tracking.
max_prepared_statements = 0
ignore_startup_parameters = extra_float_digits

logfile = /opt/homebrew/var/log/pgbouncer.log
pidfile = /opt/homebrew/var/run/pgbouncer.pid
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 300
